server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A API já responde sob /api (spec D-20): o proxy NÃO reescreve o caminho.
    # O nome "api" é resolvido a cada 10 s pelo DNS do Docker, então o nginx sobrevive a reinícios da API.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas do Angular (ex.: /pedidos/novo) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
