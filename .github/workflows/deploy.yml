name: Deploy

# Automático: depois que o CI passa em um push para o main, constrói as imagens, publica no GHCR e implanta na
# instância por SSH pelo túnel da Cloudflare. Manual: "Run workflow" com a tag de uma versão anterior (rollback).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_da_imagem:
        description: "Tag das imagens a implantar (ex.: sha-1a2b3c4). Serve para voltar a uma versão anterior."
        required: true

# Um deploy por vez, sem cancelar o que está em andamento (cancelar no meio deixaria a troca pela metade).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  imagens:
    name: Construir e publicar as imagens
    # Só para pushes ao main do PRÓPRIO repositório: nunca para pull requests nem forks (o repositório é público).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Definir a tag e o dono das imagens
        id: meta
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "tag=sha-${COMMIT::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Pedidos.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mini-gestao-pedidos-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/mini-gestao-pedidos-api:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mini-gestao-pedidos-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/mini-gestao-pedidos-frontend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  implantar:
    name: Implantar na instância
    needs: [imagens]
    # Automático depois das imagens; ou manual (workflow_dispatch), quando o job "imagens" é pulado de propósito.
    if: >-
      always() &&
      (needs.imagens.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O ambiente guarda as variáveis e os segredos do deploy e pode exigir aprovação manual (Settings > Environments).
    environment: producao
    steps:
      - name: Definir o que implantar
        id: alvo
        env:
          TAG_MANUAL: ${{ inputs.tag_da_imagem }}
          TAG_AUTOMATICA: ${{ needs.imagens.outputs.tag }}
        run: |
          tag="${TAG_MANUAL:-$TAG_AUTOMATICA}"
          [[ "$tag" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "Tag inválida: '$tag'" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Implantando $tag"

      - name: Instalar o cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.deb" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.11.0/cloudflared-linux-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"

      - name: Configurar o SSH
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Confere se tudo o que o deploy precisa chegou ao job (só os NOMES são exibidos, nunca os valores).
          faltando=()
          [[ -n "$SSH_HOST" ]] || faltando+=(SSH_HOST)
          [[ -n "$SSH_USER" ]] || faltando+=(SSH_USER)
          [[ -n "$SSH_HOST_KEY" ]] || faltando+=(SSH_HOST_KEY)
          [[ -n "$SSH_PRIVATE_KEY" ]] || faltando+=(SSH_PRIVATE_KEY)
          if (( ${#faltando[@]} > 0 )); then
            echo "Faltam no ambiente 'producao' do GitHub (Settings > Environments > producao): ${faltando[*]}" >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          # Remove o CR do Windows (o clipboard do PowerShell traz CRLF) e garante a quebra de linha final; sem isso o
          # OpenSSH recusa a chave com "error in libcrypto".
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Falha cedo, dizendo o que há de errado sem expor a chave (o ssh-keygen -y também detecta chave com senha).
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null 2> "$RUNNER_TEMP/erro-chave.txt"; then
            linhas=$(wc -l < ~/.ssh/deploy_key)
            [[ "$(head -n 1 ~/.ssh/deploy_key)" == "-----BEGIN OPENSSH PRIVATE KEY-----" ]] && inicio=sim || inicio=nao
            [[ "$(tail -n 1 ~/.ssh/deploy_key)" == "-----END OPENSSH PRIVATE KEY-----" ]] && fim=sim || fim=nao
            echo "O segredo SSH_PRIVATE_KEY não é uma chave privada válida." >&2
            echo "Diagnóstico (sem expor a chave): linhas=$linhas; começa com BEGIN OPENSSH=$inicio; termina com END OPENSSH=$fim" >&2
            echo "Erro do ssh-keygen: $(head -n 1 "$RUNNER_TEMP/erro-chave.txt")" >&2
            exit 1
          fi
          # Chave do servidor fixada: protege contra alguém se passar pela instância.
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          {
            printf 'Host %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  ServerAliveInterval 30\n'
            printf '  ProxyCommand cloudflared access ssh --hostname %%h\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Implantar
        env:
          # O cloudflared lê o service token destas variáveis para passar pelo Cloudflare Access.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          [[ -n "$TUNNEL_SERVICE_TOKEN_ID" && -n "$TUNNEL_SERVICE_TOKEN_SECRET" ]] \
            || { echo "Faltam os segredos CF_ACCESS_CLIENT_ID e/ou CF_ACCESS_CLIENT_SECRET no ambiente 'producao'." >&2; exit 1; }
          # A tag já foi validada (sha-XXXXXXX): o commit é o que vem depois de "sha-".
          ssh -o BatchMode=yes "$SSH_HOST" \
            "cd ~/gestao-pedidos && git fetch --quiet origin && git checkout --quiet --detach ${TAG#sha-} && bash scripts/deploy-remoto.sh ${TAG}"
