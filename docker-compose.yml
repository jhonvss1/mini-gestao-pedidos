name: gestao-pedidos

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gestao_Pedidos_Dev_2026!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Serviço de uma execução: cria o banco, o schema e a carga inicial (scripts idempotentes).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gestao_Pedidos_Dev_2026!}
      # Carga de dados: "true" = carga pequena de desenvolvimento (02-seed.sql, padrão aqui), "demonstracao" = carga
      # maior para o ambiente publicado (05-seed-demonstracao.sql) e "false" = banco vazio. Só entra se cliente estiver vazia.
      CARGA_INICIAL: ${CARGA_INICIAL:-true}
      # Se definida, cria o login restrito app_pedidos (03 e 04) para a API usar no lugar do sa. Vazia em desenvolvimento.
      SENHA_APP: ${SENHA_APP:-}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        sql() { /opt/mssql-tools18/bin/sqlcmd -C -b -I -f 65001 -S db -U sa -P "$$MSSQL_SA_PASSWORD" "$$@"; }
        sql -d master -i /scripts/00-create-database.sql
        sql -d gestao_pedidos -i /scripts/01-schema.sql
        case "$${CARGA_INICIAL}" in
          true) sql -d gestao_pedidos -i /scripts/02-seed.sql ;;
          demonstracao) sql -d gestao_pedidos -i /scripts/05-seed-demonstracao.sql ;;
          false) ;;
          *) echo "CARGA_INICIAL invalida: use true, demonstracao ou false." >&2; exit 1 ;;
        esac
        if [ -n "$${SENHA_APP}" ]; then
          sql -d master -v SENHA_APP="$$SENHA_APP" -i /scripts/03-login-aplicacao.sql
          sql -d gestao_pedidos -i /scripts/04-permissoes-aplicacao.sql
        fi
        echo "Banco gestao_pedidos pronto."

  api:
    build:
      context: .
      dockerfile: src/Pedidos.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Pedidos: "Server=db,1433;Database=gestao_pedidos;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Gestao_Pedidos_Dev_2026!};TrustServerCertificate=True"
    ports:
      - "${API_PORT:-5080}:8080"
    # A imagem do ASP.NET não traz curl nem wget: a requisição HTTP a /api/saude (que consulta o banco) é feita com o
    # /dev/tcp do bash, e o teste só passa com resposta 200.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/saude HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      # 127.0.0.1 e não "localhost": o wget do Alpine tenta IPv6 (::1) e o nginx escuta só em IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mssql-data:
