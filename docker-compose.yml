name: gestao-pedidos

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gestao_Pedidos_Dev_2026!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Serviço de uma execução: cria o banco, o schema e a carga inicial (scripts idempotentes).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gestao_Pedidos_Dev_2026!}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        sql() { /opt/mssql-tools18/bin/sqlcmd -C -b -I -f 65001 -S db -U sa -P "$$MSSQL_SA_PASSWORD" "$$@"; }
        sql -d master -i /scripts/00-create-database.sql
        sql -d gestao_pedidos -i /scripts/01-schema.sql
        sql -d gestao_pedidos -i /scripts/02-seed.sql
        echo "Banco gestao_pedidos pronto."

  api:
    build:
      context: .
      dockerfile: src/Pedidos.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Pedidos: "Server=db,1433;Database=gestao_pedidos;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Gestao_Pedidos_Dev_2026!};TrustServerCertificate=True"
    ports:
      - "${API_PORT:-5080}:8080"
    # A imagem do ASP.NET não traz curl nem wget: o teste só confirma que a porta aceita conexões.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      # 127.0.0.1 e não "localhost": o wget do Alpine tenta IPv6 (::1) e o nginx escuta só em IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mssql-data:
